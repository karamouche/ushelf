name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 1.2.3)
        required: true
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  version-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          branch="release/v${version}"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists." >&2
            exit 1
          fi

          node scripts/set-version.mjs "$tag"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/mcp/package.json apps/server/package.json apps/web/package.json packages/core/package.json
          git commit -m "chore: release ${tag}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release ${tag}" \
            --body "Updates all uShelf project versions to ${version}. Merging this PR publishes ${tag}."

  context:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="${HEAD_BRANCH#release/}"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

  verify:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Verify merged project versions
        run: |
          node scripts/set-version.mjs "${{ needs.context.outputs.tag }}"
          git diff --exit-code
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm format:check
      - run: pnpm validate:skills
      - run: go -C apps/cli vet ./...

  cli:
    needs: [context, verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go -C apps/cli build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION} -X main.commit=${{ needs.context.outputs.sha }} -X main.buildDate=${built}" -o ushelf ./cmd/ushelf
          go version -m apps/cli/ushelf
          if [ "$GOOS/$GOARCH" = "linux/amd64" ]; then apps/cli/ushelf --version; fi
          tar -C apps/cli -czf "ushelf_${GOOS}_${GOARCH}.tar.gz" ushelf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ushelf_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  image:
    needs: [context, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            USHELF_VERSION=${{ needs.context.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.context.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test runtime image
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
          docker run -d --name ushelf-smoke -p 127.0.0.1:43110:43110 -e USHELF_HOST=0.0.0.0 "$image"
          trap 'docker logs ushelf-smoke; docker rm -f ushelf-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43110/api/health; then exit 0; fi
            sleep 1
          done
          exit 1

  publish:
    needs: [context, verify, cli, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - run: |
          cp install.sh release/install.sh
          cd release
          sha256sum ushelf_*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/ushelf_*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.context.outputs.tag }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: gh release create "$RELEASE_TAG" release/* --target "$RELEASE_SHA" --generate-notes --title "uShelf $RELEASE_TAG"
