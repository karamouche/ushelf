name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm format:check
      - run: pnpm validate:skills
      - run: go -C apps/cli vet ./...

  cli:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go -C apps/cli build -trimpath -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.buildDate=${built}" -o ushelf ./cmd/ushelf
          go version -m apps/cli/ushelf
          if [ "$GOOS/$GOARCH" = "linux/amd64" ]; then apps/cli/ushelf --version; fi
          tar -C apps/cli -czf "ushelf_${GOOS}_${GOARCH}.tar.gz" ushelf
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ushelf_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            USHELF_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test runtime image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.version.outputs.version }}"
          docker run -d --name ushelf-smoke -p 127.0.0.1:43110:43110 -e USHELF_HOST=0.0.0.0 "$image"
          trap 'docker logs ushelf-smoke; docker rm -f ushelf-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43110/api/health; then exit 0; fi
            sleep 1
          done
          exit 1

  release:
    needs: [verify, cli, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - run: |
          cp install.sh release/install.sh
          cd release
          sha256sum ushelf_*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/ushelf_*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "uShelf $GITHUB_REF_NAME"
