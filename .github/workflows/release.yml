name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 1.2.3)
        required: true
        type: string
  # Publish from the push that merges a release PR: the run's ref is then refs/heads/main, which the
  # release environment requires. A pull_request trigger would run on refs/pull/<n>/merge instead.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          COMMIT_AUTHOR: ${{ github.actor }}
          COMMIT_AUTHOR_ID: ${{ github.actor_id }}
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          branch="release/v${version}"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists." >&2
            exit 1
          fi

          node scripts/set-version.mjs "$tag"
          git switch -c "$branch"
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "${COMMIT_AUTHOR_ID}+${COMMIT_AUTHOR}@users.noreply.github.com"
          git add package.json apps/mcp/package.json apps/server/package.json apps/web/package.json apps/docs/package.json packages/core/package.json
          git commit -m "chore: release ${tag}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release ${tag}" \
            --body "Updates all uShelf project versions to ${version}. Merging this PR publishes ${tag}."

  # Leaves every output empty unless this push merged a release PR, which skips the remaining jobs.
  context:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          head_branch="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" --jq '
            [.[] | select(
              .merged_at != null and
              .merge_commit_sha == env.MERGE_SHA and
              .base.ref == "main" and
              .head.repo.full_name == env.GITHUB_REPOSITORY and
              (.head.ref | startswith("release/v"))
            )] | first | .head.ref // empty')"
          if [ -z "$head_branch" ]; then
            echo "Commit ${MERGE_SHA} does not merge a release pull request; nothing to publish."
            exit 0
          fi
          tag="${head_branch#release/}"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

  verify:
    needs: context
    if: needs.context.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Verify merged project versions
        run: |
          node scripts/set-version.mjs "${{ needs.context.outputs.tag }}"
          git diff --exit-code
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm format:check
      - run: pnpm validate:skills
      - run: go -C apps/cli vet ./...

  cli:
    needs: [context, verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go -C apps/cli build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION} -X main.commit=${{ needs.context.outputs.sha }} -X main.buildDate=${built}" -o ushelf ./cmd/ushelf
          go version -m apps/cli/ushelf
          if [ "$GOOS/$GOARCH" = "linux/amd64" ]; then apps/cli/ushelf --version; fi
          archive_root="$(mktemp -d)"
          cp apps/cli/ushelf LICENSE THIRD_PARTY_NOTICES.md "$archive_root/"
          tar -C "$archive_root" -czf "ushelf_${GOOS}_${GOARCH}.tar.gz" ushelf LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ushelf_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  image:
    needs: [context, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            USHELF_VERSION=${{ needs.context.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ needs.context.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test runtime image
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
          docker run -d --name ushelf-smoke -p 127.0.0.1:43110:43110 -e USHELF_HOST=0.0.0.0 -e USHELF_PUBLISHED_HOST=127.0.0.1 "$image"
          trap 'docker logs ushelf-smoke; docker rm -f ushelf-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43110/api/health; then exit 0; fi
            sleep 1
          done
          exit 1

  publish:
    needs: [context, verify, cli, image]
    runs-on: ubuntu-latest
    # Holds RELEASE_SIGNING_KEY; restrict its deployments to main.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - run: |
          cp install.sh release/install.sh
          cd release
          sha256sum ushelf_*.tar.gz > SHA256SUMS
      # `ushelf update` only trusts SHA256SUMS signed by a key built into the CLI.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "The RELEASE_SIGNING_KEY secret is not configured." >&2
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          # Refuse to publish a signature that released CLIs could not verify.
          public_key="$(openssl pkey -in "$key_file" -pubout -outform DER | tail -c 32 | base64)"
          if ! grep -qF "\"${public_key}\"" apps/cli/internal/cli/release_signature.go; then
            echo "RELEASE_SIGNING_KEY does not match a key in apps/cli/internal/cli/release_signature.go." >&2
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in release/SHA256SUMS -out release/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/ushelf_*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.context.outputs.tag }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: gh release create "$RELEASE_TAG" release/* --target "$RELEASE_SHA" --generate-notes --title "uShelf $RELEASE_TAG"
      - name: Promote verified runtime image to latest
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: >-
          docker buildx imagetools create
          --tag "ghcr.io/${GITHUB_REPOSITORY}:latest"
          "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
