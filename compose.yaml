services:
  ushelf:
    build:
      context: .
      args:
        USHELF_WEB_BASE_PATH: ${USHELF_WEB_BASE_PATH:-/}
        USHELF_PORT: ${USHELF_PORT:-43110}
        USHELF_VERSION: ${USHELF_VERSION:-dev}
    image: ushelf:local
    init: true
    restart: unless-stopped
    user: "${USHELF_UID:-1000}:${USHELF_GID:-1000}"
    environment:
      NODE_ENV: production
      # These two values describe paths and networking inside the container.
      # Host-side values still come from .env below for bind mounts and ports.
      USHELF_HOST: 0.0.0.0
      USHELF_ROOT: /data
      USHELF_PORT: ${USHELF_PORT:-43110}
      USHELF_WEB_BASE_PATH: ${USHELF_WEB_BASE_PATH:-/}
      USHELF_APP_PASSWORD: ${USHELF_APP_PASSWORD:-}
    ports:
      - "${USHELF_HOST:-127.0.0.1}:${USHELF_PORT:-43110}:${USHELF_PORT:-43110}"
    volumes:
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/library
        target: /data/library
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/state
        target: /data/state
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/recipes
        target: /data/recipes
        read_only: true
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/secrets
        target: /data/secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const base = process.env.USHELF_WEB_BASE_PATH === '/'
            ? '' : process.env.USHELF_WEB_BASE_PATH.replace(/\/$/, '');
          const port = process.env.USHELF_PORT;
          fetch(`http://127.0.0.1:$${port}$${base}/api/health`).then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s

  maintenance:
    profiles: [tools]
    image: ushelf:local
    init: true
    user: "${USHELF_UID:-1000}:${USHELF_GID:-1000}"
    environment:
      NODE_ENV: production
      USHELF_ROOT: /data
    volumes:
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/library
        target: /data/library
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/state
        target: /data/state
      - type: bind
        source: ${USHELF_ROOT:-${HOME}/.ushelf}/recipes
        target: /data/recipes
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "apps/server/dist/cli.js"]
