services:
  ushelf:
    image: ${USHELF_IMAGE:-ghcr.io/karamouche/ushelf:latest}
    restart: unless-stopped
    init: true
    environment:
      USHELF_MODE: remote
      USHELF_PUBLIC_URL: ${USHELF_PUBLIC_URL:?Set a stable HTTPS origin}
      USHELF_ROOT: /data
      USHELF_HOST: 0.0.0.0
    volumes:
      - ushelf-data:/data
    ports:
      - "127.0.0.1:43110:43110"
    security_opt:
      - no-new-privileges:true

volumes:
  ushelf-data:
